<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/exercicios.css">
    <title>Criar Exercício</title>
</head>
<body>
    
    <header>
        <nav>

        </nav>
    </header>

    <main>

    <div class="header-titulo">
        <h1>Criar Exercício</h1>
        <a href="index.html">Voltar</a>
    </div>

        <form action="salveExercicio" method="post">
            
            <label for="materia">Materia:</label>
            <select name="materia" id="materia">
                <option value="">Selecione uma materia</option>
                <option value="matematica">Matemática</option>
                <option value="portugues">Língua Portuguesa</option>
                <option value="historia">História</option>
                <option value="biologia">Biologia</option>
                <option value="física">Física</option>
                <option value="geografia">Geografia</option>
            </select><br>

            <label for="produto">Produto:</label>
            <select id="produto" name="produto" disabled>
                <option value="">Selecione o conteúdo</option>
            </select><br><br>

            <label for="enunciado">Enunciado:</label>
            <input type="text" id="enunciado" name="enunciado" placeholder="Digite o enunciado do exercício" required><br><br>

            <label for="resposta">Resposta A:</label>
            <input type="text" id="resposta" name="resposta" placeholder="Digite a resposta A" required><br>
            <label for="respostaB">Resposta B:</label>
            <input type="text" id="respostaB" name="respostaB" placeholder="Digite a resposta B" required><br>
            <label for="respostaC">Resposta C:</label>
            <input type="text" id="respostaC" name="respostaC" placeholder="Digite a resposta C" required><br>
            <label for="respostaD">Resposta D:</label>
            <input type="text" id="respostaD" name="respostaD" placeholder="Digite a resposta D" required><br>

            <div class="selecao-correta" style="margin-top: 20px;">
            <p><strong>Qual das alternativas acima é a correta?</strong></p>
            
            <input type="radio" name="alternativa_correta" value="A" required>
            <label for="corretaA">Alternativa A</label>

            <input type="radio" name="alternativa_correta" value="B">
            <label for="corretaB">Alternativa B</label>

            <input type="radio"  name="alternativa_correta" value="C">
            <label for="corretaC">Alternativa C</label>

            <input type="radio" name="alternativa_correta" value="D">
            <label for="corretaD">Alternativa D</label>
            </div><br>
            
            <input type="submit" value="Criar exercício">

        </form>

    </main>
    <script src="js/criar_exercicios.js"></script>
</body>
</html>
